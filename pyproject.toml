[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onmint-mcp"
version = "0.1.0"
description = "MCP server exposing the on:mint authenticity API (protect-original + AI-Act labeling) to AI tools and developers."
requires-python = ">=3.11"
dependencies = [
    # mcp 2.0.0 removed `mcp.server.fastmcp`, which this server is built on.
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
onmint-mcp = "onmint_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
